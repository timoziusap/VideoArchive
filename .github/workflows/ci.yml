name CI

on
  push
    branches [ main ]
  pull_request
    branches [ main ]

jobs
  build-and-test
    runs-on ubuntu-latest
    steps
      - name Checkout
        uses actionscheckout@v4

      - name Set up JDK 26
        uses actionssetup-java@v4
        with
          distribution 'temurin'
          java-version '26'
          cache maven

      - name Run tests
        run mvn -B test