
spring.application.name=VideoArchive
#Profiles
spring.profiles.active=dev
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.url=jdbc:hsqldb:file:~/mydb
spring.datasource.username=sa
spring.datasource.password=

#JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Statische Ressourcen aus dem public/-Ordner im Projekt-Stamm bedienen
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:./public/

